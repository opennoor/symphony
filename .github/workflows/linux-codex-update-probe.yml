name: Linux Codex active update probe

on:
  push:
    branches:
      - fix/session-terminal-replay-and-updates

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Codex CLI
        run: npm install -g @openai/codex@0.158.0
      - name: Probe active 1.5.1 to candidate update
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SYMPHONY_NATIVE_DIAGNOSTICS_DIR: ${{ runner.temp }}/codex-update-diagnostics
        run: |
          test -n "$OPENAI_API_KEY"
          git fetch origin tag v1.5.1
          git worktree add --detach "$RUNNER_TEMP/symphony-old-release" v1.5.1
          python3 .github/scripts/native_managed_concurrency.py --provider codex \
            --timeout 600 --live-update --only-live-update \
            --old-plugin-root "$RUNNER_TEMP/symphony-old-release/plugins/symphony" \
            --candidate-plugin-root "$GITHUB_WORKSPACE/plugins/symphony"
      - name: Retain sanitized native failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-codex-update-probe
          path: ${{ runner.temp }}/codex-update-diagnostics/*.json
          if-no-files-found: ignore
