name: Windows parallel pin diagnostic

on:
  push:
    branches: [fix/session-terminal-replay-and-updates]

jobs:
  standard-user-parallel-pin:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repeat focused first-pin test as standard user
        shell: pwsh
        run: |
          $user = 'symphony-pin-ci'
          $secure = ConvertTo-SecureString ([guid]::NewGuid().ToString('N') + 'aA1!') -AsPlainText -Force
          $testRoot = Join-Path $env:PUBLIC 'symphony-pin-diagnostics'
          New-Item -ItemType Directory -Force -Path $testRoot | Out-Null
          New-LocalUser -Name $user -Password $secure | Out-Null
          try {
            icacls.exe $testRoot /grant "$($env:COMPUTERNAME)\${user}:(OI)(CI)M" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Could not grant test directory access' }
            $env:PYTHONPATH = $env:GITHUB_WORKSPACE
            $env:TEMP = $testRoot
            $env:TMP = $testRoot
            $env:SYMPHONY_REQUIRE_STANDARD_USER = '1'
            $credential = [pscredential]::new("$env:COMPUTERNAME\$user", $secure)
            $python = (Get-Command python.exe -CommandType Application | Select-Object -First 1).Source
            for ($index = 1; $index -le 10; $index++) {
              $stdout = Join-Path $testRoot "stdout-$index.log"
              $stderr = Join-Path $testRoot "stderr-$index.log"
              $test = Start-Process -FilePath $python -WorkingDirectory $env:GITHUB_WORKSPACE `
                -Credential $credential -LoadUserProfile -PassThru `
                -ArgumentList '-m unittest plugins.symphony.tests.test_runtime_retention.RuntimeRetentionTests.test_first_pin_is_atomic_for_parallel_hooks' `
                -RedirectStandardOutput $stdout -RedirectStandardError $stderr
              if (-not $test.WaitForExit(60000)) {
                Stop-Process -Id $test.Id -Force -ErrorAction SilentlyContinue
                throw "Focused run $index exceeded one minute"
              }
              Write-Host "Focused run $index exit $($test.ExitCode)"
              Get-Content $stdout,$stderr -ErrorAction SilentlyContinue
              if ($test.ExitCode -ne 0) { throw "Focused run $index failed" }
            }
          } finally {
            Remove-LocalUser -Name $user
          }
