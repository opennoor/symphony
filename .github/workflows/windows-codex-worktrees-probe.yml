name: Windows Codex separate worktrees probe

on:
  push:
    branches:
      - fix/session-terminal-replay-and-updates
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Codex CLI
        run: npm.cmd install -g @openai/codex@0.158.0
      - name: Probe completing lead across separate worktrees
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if (-not $env:OPENAI_API_KEY) { throw 'OPENAI_API_KEY is required' }
          $env:CODEX_HOME = Join-Path $env:RUNNER_TEMP 'codex-worktrees-probe-home'
          $env:SYMPHONY_NATIVE_DIAGNOSTICS_DIR = Join-Path $env:RUNNER_TEMP 'codex-worktrees-diagnostics'
          New-Item -ItemType Directory -Force -Path $env:CODEX_HOME | Out-Null
          $env:OPENAI_API_KEY | codex login --with-api-key
          if ($LASTEXITCODE -ne 0) { throw 'Codex login failed' }
          codex plugin marketplace add $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw 'Codex marketplace add failed' }
          codex plugin add symphony@symphony
          if ($LASTEXITCODE -ne 0) { throw 'Codex plugin add failed' }
          $version = (Get-Content 'plugins/symphony/.codex-plugin/plugin.json' -Raw | ConvertFrom-Json).version
          $env:SYMPHONY_EXPECTED_PLUGIN_ROOT = Join-Path $env:CODEX_HOME "plugins/cache/symphony/symphony/$version"
          python .github/scripts/native_managed_concurrency.py --provider codex `
            --timeout 450 --only-worktrees
          if ($LASTEXITCODE -ne 0) { throw 'Separate-worktree Codex probe failed; see sanitized artifact' }
      - name: Retain sanitized native failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-codex-worktrees-probe
          path: ${{ runner.temp }}/codex-worktrees-diagnostics/*.json
          if-no-files-found: ignore
