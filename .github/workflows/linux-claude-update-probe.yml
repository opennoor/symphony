name: Linux Claude active update probe

on:
  push:
    branches:
      - fix/session-terminal-replay-and-updates
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Probe active 1.5.1 to candidate update
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SYMPHONY_NATIVE_DIAGNOSTICS_DIR: ${{ runner.temp }}/claude-update-diagnostics
        run: |
          test -n "$ANTHROPIC_API_KEY"
          git fetch origin tag v1.5.1
          git worktree add --detach "$RUNNER_TEMP/symphony-old-release" v1.5.1
          python3 .github/scripts/native_managed_concurrency.py --provider claude \
            --timeout 540 --live-update --only-live-update \
            --old-plugin-root "$RUNNER_TEMP/symphony-old-release/plugins/symphony" \
            --candidate-plugin-root "$GITHUB_WORKSPACE/plugins/symphony"
      - name: Retain sanitized native failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-claude-update-probe
          path: ${{ runner.temp }}/claude-update-diagnostics/*.json
          if-no-files-found: ignore
